name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *" # cada 10 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s -o /dev/null -w "status: %{http_code}\n" --max-time 60 \
            https://songfinder-api.onrender.com/api/health || true
